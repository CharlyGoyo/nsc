<form id="form18" action="" method="post">
	<fieldset>
		<legend>¿Has participado en años anteriores como voluntario de la Peregrinación? <b class="b7">*</b></legend>
		<label class="label7">
			<input name="experiencia" required type="radio" value="si"/>
			Sí
		</label>
		<label class="label7">
			<input name="experiencia" required type="radio" value="no"/>
			No
		</label>
	</fieldset>

	<label class="label7">
		<span>Nombre <b class="b7">*</b></span>
		<input class="input9" autocomplete="given-name" name="nombre" required type="text"/>
	</label>

	<label class="label7">
		<span>Apellidos <b class="b7">*</b></span>
		<input class="input9" autocomplete="family-name" name="apellidos" required type="text"/>
	</label>

	<label class="label7">
		<span>Email <b class="b7">*</b></span>
		<input class="input9" autocomplete="email" inputmode="email" name="email" required type="email"/>
	</label>

	<label class="label7">
		<span>Edad <b class="b7">*</b></span>
		<input class="input9" inputmode="numeric" max="120" min="0" name="edad" required step="1" type="number"/>
	</label>

	<label class="label7">
		<span>Profesión/ocupación <b class="b7">*</b></span>
		<input class="input9" autocomplete="organization-title" name="profesion" required type="text"/>
	</label>

	<label class="label7">
		<span>Teléfono <b class="b7">*</b></span>
		<input class="input9" autocomplete="tel" inputmode="tel" minlength="6" name="telefono" required type="tel"/>
		<small>If you have a foreign number, please add the prefix.</small>
	</label>

	<label class="label7">
		<span>Provincia <b class="b7">*</b></span>
		<input class="input9" autocomplete="address-level1" name="provincia" required type="text"/>
	</label>

	<label class="label7">
		<span>Localidad <b class="b7">*</b></span>
		<input class="input9" autocomplete="address-level2" name="localidad" required type="text"/>
	</label>

	<hr/>

	<fieldset>
		<legend>Selecciona la sección <b class="b7">*</b></legend>
		<label class="label7">
			<input name="seccion" required type="radio" value="limpieza"/>
			Limpieza
		</label>
		<label class="label7">
			<input name="seccion" required type="radio" value="material"/>
			Montaje y suministros
		</label>
		<label class="label7">
			<input name="seccion" required type="radio" value="personal"/>
			Transporte de personal
		</label>
	</fieldset>

	<hr/>

	<fieldset>
		<legend>¿Puedes aportar coche propio? <b class="b7">*</b></legend>
		<label class="label7">
			<input name="coche" required type="radio" value="si"/>
			Sí
		</label>
		<label class="label7">
			<input name="coche" required type="radio" value="no"/>
			No
		</label>
		<small>Imprescindible en Transporte de personal.</small>
	</fieldset>

	<hr/>

	<fieldset>
		<legend>¿Tienes alguna de estas habilidades? (selección múltiple posible) <b class="b7">*</b></legend>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Furgo"/>
			Puedo conducir una furgoneta grande (carnet B)
		</label>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Montaje"/>
			Tengo experiencia en el montaje de carpas y estructuras
		</label>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Generadores"/>
			Sé manejar generadores eléctricos
		</label>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Fontanería"/>
			Tengo experiencia en fontanería
		</label>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Peso"/>
			Puedo cargar peso de hasta 20kg
		</label>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Resistencia"/>
			Tengo gran resistencia física
		</label>
		<label class="label7">
			<input name="habilidades[]" type="checkbox" value="Orientacion"/>
			Tengo sentido de la orientación
		</label>
	</fieldset>

	<label class="label7">
		¿Qué te motiva a unirte a esta peregrinación como voluntario de Logística? ¿Por qué has elegido esa sección? <b class="b7">*</b>
		<textarea class="textarea2" name="pregunta" required rows="4"></textarea>
	</label>

	<label class="label8">
		<input name="privacidad" required type="checkbox" value="1"/>
		<span>Conozco y acepto la <a class="a5" href="/politica-de-privacidad" rel="noopener noreferrer" target="_blank">Política de Privacidad</a> de la Asociación Nuestra Señora de la Cristiandad - España. <b class="b7">*</b></span>
	</label>

	<input name="area" type="hidden" value="logistica"/>

	<button type="submit">Solicitar voluntariado</button>
</form>
