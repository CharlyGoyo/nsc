		<form id="form10" action="" method="post">
			<h4 class="h45">Inscripción</h4>
			<label class="label7">
		<span>Nombre <b class="b7">*</b></span>
		<input class="input9" autocomplete="given-name" name="nombre" required type="text"/>
			</label>

			<label class="label7">
		<span>Apellidos <b class="b7">*</b></span>
		<input class="input9" autocomplete="family-name" name="apellidos" required type="text"/>
			</label>

			<label class="label7">
		<span>Email <b class="b7">*</b></span>
		<input class="input9" autocomplete="email" inputmode="email" name="email" required type="email"/>
			</label>

			<label class="label7">
		<span>Teléfono <b class="b7">*</b></span>
		<input class="input9" autocomplete="tel" inputmode="tel" name="tel" required type="tel"/>
			</label>

			<label class="label7">
		<span>Edad <b class="b7">*</b></span>
		<input class="input9" inputmode="numeric" max="120" min="0" name="edad" required step="1" type="number"/>
			</label>

			<label class="label7">
				Sexo <b class="b7">*</b>
				<select autocomplete="sex" name="sexo" required>
					<option disabled hidden selected value=""></option>
					<option value="hombre">Hombre</option>
					<option value="mujer">Mujer</option>
				</select>
			</label>

			<label class="label7">
				Experiencia musical <b class="b7">*</b>
				<select name="nivel" required>
					<option disabled hidden selected value=""></option>
					<option value="poca">Poca</option>
					<option value="media">Media</option>
					<option value="alta">Alta</option>
					<option value="profesional">Profesional</option>
					<option value="nose">No lo sé</option>
				</select>
			</label>

			<label class="label7">
				Tipo de voz <b class="b7">*</b>
				<select name="voz" required>
					<option disabled hidden selected value=""></option>
					<option value="soprano">Soprano</option>
					<option value="alto">Alto</option>
					<option value="tenor">Tenor</option>
					<option value="bajo">Bajo</option>
					<option value="nose">No lo sé</option>
				</select>
			</label>

			<fieldset>
				<legend>¿Has participado en el coro de NSC? <b class="b7">*</b></legend>
				<label class="label7">
					<input name="coro" required type="radio" value="si"/>
					Sí
				</label>
				<label class="label7">
					<input name="coro" required type="radio" value="no"/>
					No
				</label>
			</fieldset>

			<label class="label7">
		<span>En caso de tener alguna intolerancia alimentaria, indícalo aquí</span>
		<input class="input9" autocomplete="off" name="intolerancia" type="text"/>
			</label>

			<label class="label8">
				<input name="privacidad" required type="checkbox" value="1"/>
		<span>El interesado conoce y ACEPTA la <a class="a5" href="/politica-de-privacidad" rel="noopener noreferrer" target="_blank">Política de Privacidad</a> de la Asociación Nuestra Señora de la Cristiandad - España. <b class="b7">*</b></span>
	</label>

			<p class="p1">El precio del encuentro no llega a cubrir todos los gastos del mismo. Por favor, considera hacer una donación adicional.</p>

			<label class="label7">
		<span>Donación (€)</span>
		<input class="input9" inputmode="decimal" min="0" name="donacion" placeholder="0.00" step="0.01" type="number"/>
			</label>

			<label class="label7">
				Precio total
				<output name="precio">85.00 €</output>
			</label>

			<button type="submit">Inscribirme y pagar</button>
		</form>
