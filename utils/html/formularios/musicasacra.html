		<form action="" method="post">
			<h4 class="h45">Inscripción</h4>
			<label>
				Nombre *
				<input autocomplete="given-name" name="nombre" required type="text"/>
			</label>

			<label>
				Apellidos *
				<input autocomplete="family-name" name="apellidos" required type="text"/>
			</label>

			<label>
				Email *
				<input autocomplete="email" inputmode="email" name="email" required type="email"/>
			</label>

			<label>
				Teléfono *
				<input autocomplete="tel" inputmode="tel" name="tel" required type="tel"/>
			</label>

			<label>
				Edad *
				<input inputmode="numeric" max="120" min="0" name="edad" required step="1" type="number"/>
			</label>

			<label>
				Sexo *
				<select autocomplete="sex" name="sexo" required>
					<option disabled hidden selected value=""></option>
					<option value="hombre">Hombre</option>
					<option value="mujer">Mujer</option>
				</select>
			</label>

			<label>
				Experiencia musical *
				<select name="nivel" required>
					<option disabled hidden selected value=""></option>
					<option value="poca">Poca</option>
					<option value="media">Media</option>
					<option value="alta">Alta</option>
					<option value="profesional">Profesional</option>
					<option value="nose">No lo sé</option>
				</select>
			</label>

			<label>
				Tipo de voz *
				<select name="voz" required>
					<option disabled hidden selected value=""></option>
					<option value="soprano">Soprano</option>
					<option value="alto">Alto</option>
					<option value="tenor">Tenor</option>
					<option value="bajo">Bajo</option>
					<option value="nose">No lo sé</option>
				</select>
			</label>

			<fieldset>
				<legend>¿Has participado en el coro de NSC? *</legend>
				<label>
					<input name="coro" required type="radio" value="si"/>
					Sí
				</label>
				<label>
					<input name="coro" required type="radio" value="no"/>
					No
				</label>
			</fieldset>

			<label>
				En caso de tener alguna intolerancia alimentaria, indícalo aquí
				<input autocomplete="off" name="intolerancia" type="text"/>
			</label>

			<label>
				<input name="privacidad" required type="checkbox" value="1"/>
				El interesado conoce y ACEPTA la <a href="/politica-de-privacidad" rel="noopener noreferrer" target="_blank">Política de Privacidad</a> de la Asociación Nuestra Señora de la Cristiandad - España. *
			</label>

			<p>El precio del encuentro no llega a cubrir todos los gastos del mismo. Por favor, considera hacer una donación adicional.</p>

			<label>
				Donación (€)
				<input inputmode="decimal" min="0" name="donacion" placeholder="0.00" step="0.01" type="number"/>
			</label>

			<label>
				Precio total
				<output name="precio">85.00 €</output>
			</label>

			<button type="submit">Inscribirme y pagar</button>
		</form>
