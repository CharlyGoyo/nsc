			<form id="form9" action="" method="post">
				<label class="label7">
		<span>Nombre y apellidos <b class="b7">*</b></span>
		<input class="input9" autocomplete="name" name="nombre" required type="text"/>
				</label>

				<label class="label7">
		<span>Email <b class="b7">*</b></span>
		<input class="input9" autocomplete="email" inputmode="email" name="email" required type="email"/>
				</label>

				<label class="label7">
		<span>Edad <b class="b7">*</b></span>
		<input class="input9" inputmode="numeric" max="120" min="0" name="edad" required step="1" type="number"/>
				</label>

				<label class="label7">
					Sexo <b class="b7">*</b>
					<select autocomplete="sex" name="sexo" required>
						<option disabled hidden selected value=""></option>
						<option value="hombre">Hombre</option>
						<option value="mujer">Mujer</option>
					</select>
				</label>

				<label class="label7">
		<span>Teléfono <b class="b7">*</b></span>
		<input class="input9" autocomplete="tel" inputmode="tel" name="tel" required type="tel"/>
				</label>

				<label class="label7">
		<span>Ciudad de residencia <b class="b7">*</b></span>
		<input class="input9" autocomplete="address-level2" name="ciudad" required type="text"/>
				</label>

				<label class="label7">
		<span>En caso de tener alguna intolerancia alimentaria, indíquelo aquí</span>
		<input class="input9" autocomplete="off" name="intolerancia" type="text"/>
				</label>

				<label class="label7">
		<span>Si vas en coche, ¿cuántas plazas tienes libres?</span>
		<input class="input9" inputmode="numeric" max="9" min="0" name="plazas_libres" step="1" type="number"/>
				</label>

				<fieldset>
					<legend>Quiero ser incluido en el grupo de Whatsapp del encuentro <b class="b7">*</b></legend>
					<label class="label7">
						<input name="whatsapp" required type="radio" value="si"/>
						Sí
					</label>
					<label class="label7">
						<input name="whatsapp" required type="radio" value="no"/>
						No
					</label>
				</fieldset>

				<label class="label8">
					<input name="privacidad" required type="checkbox" value="1"/>
		<span>El interesado conoce y ACEPTA la <a class="a5" href="/politica-de-privacidad" rel="noopener noreferrer" target="_blank">Política de Privacidad</a> de la Asociación Nuestra Señora de la Cristiandad - España. <b class="b7">*</b></span>
	</label>

				<button type="submit">Solicitar plaza</button>
			</form>
