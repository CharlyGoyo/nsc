<form action="" method="post">
	<fieldset>
		<legend>¿Has participado en años anteriores como voluntario de la Peregrinación? *</legend>
		<label>
			<input name="experiencia" required type="radio" value="si"/>
			Sí
		</label>
		<label>
			<input name="experiencia" required type="radio" value="no"/>
			No
		</label>
	</fieldset>

	<label>
		Nombre *
		<input autocomplete="given-name" name="nombre" required type="text"/>
	</label>

	<label>
		Apellidos *
		<input autocomplete="family-name" name="apellidos" required type="text"/>
	</label>

	<label>
		Email *
		<input autocomplete="email" inputmode="email" name="email" required type="email"/>
	</label>

	<label>
		Edad *
		<input inputmode="numeric" max="120" min="18" name="edad" required step="1" type="number"/>
	</label>

	<label>
		Profesión/ocupación *
		<input autocomplete="organization-title" name="profesion" required type="text"/>
	</label>

	<label>
		Teléfono *
		<input autocomplete="tel" inputmode="tel" minlength="6" name="telefono" required type="tel"/>
		<small>If you have a foreign number, please add the prefix.</small>
	</label>

	<label>
		Provincia *
		<input autocomplete="address-level1" name="provincia" required type="text"/>
	</label>

	<label>
		Localidad *
		<input autocomplete="address-level2" name="localidad" required type="text"/>
	</label>

	<hr/>

	<fieldset>
		<legend>¿Puedes aportar coche propio? *</legend>
		<label>
			<input name="coche" required type="radio" value="si"/>
			Sí
		</label>
		<label>
			<input name="coche" required type="radio" value="no"/>
			No
		</label>
	</fieldset>

	<hr/>

	<fieldset>
		<legend>Marca las opciones que sean ciertas en tu caso</legend>
		<label>
			<input name="habilidades[]" type="checkbox" value="teleco"/>
			Tengo experiencia en el manejo de equipos de telecomunicaciones
		</label>
		<label>
			<input name="habilidades[]" type="checkbox" value="segurata"/>
			Me dedico profesionalmente a la seguridad
		</label>
		<label>
			<input name="habilidades[]" type="checkbox" value="tranquilo"/>
			Soy una persona de temperamento tranquilo, raras veces pierdo los papeles
		</label>
		<label>
			<input name="habilidades[]" type="checkbox" value="calmado"/>
			Suelo mantener la calma ante situaciones estresantes
		</label>
	</fieldset>

	<label>
		Imagina que se acerca al control de acceso del campamento un peregrino en coche que te pide que le dejes pasar sólo para poder dejar su equipaje y tienda de campaña, sin aparcar. ¿Qué harías? *
		<textarea name="pregunta1" required rows="4"></textarea>
	</label>

	<label>
		¿Qué harías si ves a peregrinos con símbolos políticos de cualquier tipo en camisetas o en banderas? *
		<textarea name="pregunta2" required rows="4"></textarea>
	</label>

	<label>
		¿Qué te motiva a unirte a esta peregrinación como voluntario de Seguridad? *
		<textarea name="pregunta3" required rows="4"></textarea>
	</label>

	<label>
		<input name="privacidad" required type="checkbox" value="1"/>
		Conozco y acepto la <a href="/politica-de-privacidad" rel="noopener noreferrer" target="_blank">Política de Privacidad</a> de la Asociación Nuestra Señora de la Cristiandad - España. *
	</label>

	<input name="area" type="hidden" value="seguridad"/>

	<button type="submit">Solicitar voluntariado</button>
</form>
