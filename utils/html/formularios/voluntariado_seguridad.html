<form id="form21" action="" method="post">
	<fieldset>
		<legend>¿Has participado en años anteriores como voluntario de la Peregrinación? <b class="b7">*</b></legend>
		<label class="label9">
			<input name="experiencia" required type="radio" value="si"/>
			Sí
		</label>
		<label class="label9">
			<input name="experiencia" required type="radio" value="no"/>
			No
		</label>
	</fieldset>

	<label class="label9">
		Nombre <b class="b7">*</b>
		<input class="input9" autocomplete="given-name" name="nombre" required type="text"/>
	</label>

	<label class="label9">
		Apellidos <b class="b7">*</b>
		<input class="input9" autocomplete="family-name" name="apellidos" required type="text"/>
	</label>

	<label class="label9">
		Email <b class="b7">*</b>
		<input class="input9" autocomplete="email" inputmode="email" name="email" required type="email"/>
	</label>

	<label class="label9">
		Edad <b class="b7">*</b>
		<input class="input9" inputmode="numeric" max="120" min="18" name="edad" required step="1" type="number"/>
	</label>

	<label class="label9">
		Profesión/ocupación <b class="b7">*</b>
		<input class="input9" autocomplete="organization-title" name="profesion" required type="text"/>
	</label>

	<label class="label9">
		Teléfono <b class="b7">*</b>
		<input class="input9" autocomplete="tel" inputmode="tel" minlength="6" name="telefono" required type="tel"/>
		<small>If you have a foreign number, please add the prefix.</small>
	</label>

	<label class="label9">
		Provincia <b class="b7">*</b>
		<input class="input9" autocomplete="address-level1" name="provincia" required type="text"/>
	</label>

	<label class="label9">
		Localidad <b class="b7">*</b>
		<input class="input9" autocomplete="address-level2" name="localidad" required type="text"/>
	</label>

	<hr/>

	<fieldset>
		<legend>¿Puedes aportar coche propio? <b class="b7">*</b></legend>
		<label class="label9">
			<input name="coche" required type="radio" value="si"/>
			Sí
		</label>
		<label class="label9">
			<input name="coche" required type="radio" value="no"/>
			No
		</label>
	</fieldset>

	<hr/>

	<fieldset>
		<legend>Marca las opciones que sean ciertas en tu caso</legend>
		<label class="label9">
			<input name="habilidades[]" type="checkbox" value="teleco"/>
			Tengo experiencia en el manejo de equipos de telecomunicaciones
		</label>
		<label class="label9">
			<input name="habilidades[]" type="checkbox" value="segurata"/>
			Me dedico profesionalmente a la seguridad
		</label>
		<label class="label9">
			<input name="habilidades[]" type="checkbox" value="tranquilo"/>
			Soy una persona de temperamento tranquilo, raras veces pierdo los papeles
		</label>
		<label class="label9">
			<input name="habilidades[]" type="checkbox" value="calmado"/>
			Suelo mantener la calma ante situaciones estresantes
		</label>
	</fieldset>

	<label class="label9">
		Imagina que se acerca al control de acceso del campamento un peregrino en coche que te pide que le dejes pasar sólo para poder dejar su equipaje y tienda de campaña, sin aparcar. ¿Qué harías? <b class="b7">*</b>
		<textarea class="textarea2" name="pregunta1" required rows="4"></textarea>
	</label>

	<label class="label9">
		¿Qué harías si ves a peregrinos con símbolos políticos de cualquier tipo en camisetas o en banderas? <b class="b7">*</b>
		<textarea class="textarea2" name="pregunta2" required rows="4"></textarea>
	</label>

	<label class="label9">
		¿Qué te motiva a unirte a esta peregrinación como voluntario de Seguridad? <b class="b7">*</b>
		<textarea class="textarea2" name="pregunta3" required rows="4"></textarea>
	</label>

	<label class="label9">
		<input name="privacidad" required type="checkbox" value="1"/>
		Conozco y acepto la <a class="a5" href="/politica-de-privacidad" rel="noopener noreferrer" target="_blank">Política de Privacidad</a> de la Asociación Nuestra Señora de la Cristiandad - España. <b class="b7">*</b>
	</label>

	<input name="area" type="hidden" value="seguridad"/>

	<button type="submit">Solicitar voluntariado</button>
</form>
