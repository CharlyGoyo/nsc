<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar suscripción</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;font-family:'Open Sans',Helvetica,Arial,sans-serif;color:#676a6c;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
  <tr>
    <td align="center" style="padding:30px 10px;">
      <table width="570" cellpadding="0" cellspacing="0" border="0" style="max-width:570px;width:100%;">
        <tr>
          <td align="center" style="padding:0 20px 30px;font-size:20px;line-height:30px;font-weight:600;color:#676a6c;">
            Por favor, confirme su suscripción
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 20px 30px;">
            <a href="{{doubleOptinUrl}}" target="_blank" style="display:inline-block;padding:10px 30px;background-color:#4ca4e0;border-radius:5px;color:#ffffff;font-size:14px;line-height:24px;font-weight:600;text-transform:uppercase;text-decoration:none;">
              Sí, suscribirme a esta lista
            </a>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 20px 70px;font-size:14px;line-height:24px;color:#676a6c;">
            Si ha recibido este e-mail por error, solo tiene que borrarlo. No se suscribirá a nuestra lista de distribución si no hace clic en el enlace de confirmación que aparece más arriba.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:0 20px;font-size:16px;line-height:30px;font-weight:700;color:#aaaaaa;">
            brevo
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
